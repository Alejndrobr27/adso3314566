<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>07-JavaScript</title>
    <link rel="stylesheet" href="../src/css/04-js.css" />
    <style>
      div.vehicle {
        &.dark {
          background-color: #333333;
          header {
            button.mode {
              background: url(imgs/mode.light.svg) no-repeat center / cover;
            }
          }
        }
        width: 356px;
        height: 576px;
        padding: 12px;
        background-color: #ffffff;
        border: 2px solid #ff0000;
        margin: 0 auto;
        border-radius: 8px;
        header {
          align-items: center;
          display: flex;
          justify-content: space-between;
          figure {
            border: 2px solid #ff0000;
            background: url(imgs/Mt-09.png) no-repeat center / cover;
            width: 220px;
            height: 49px;
            margin: 0 auto;
          }
          button.mode {
            background: url(imgs/mode.light.svg) no-repeat center / cover;
            border: none;
            height: 60px;
            width: 100px;
            cursor: pointer;
            transition: transform 0.4s ease-in;
            &.hover {
              transform: scale(1.1);
            }
          }
        }
      }
    </style>
  </head>

  <body>
    <a href="/04-js/index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
        ></path>
      </svg>
    </a>

    <main>
      <header>
        <h1>07-vehicle-object</h1>
        <h2>Class Vehicle.</h2>
      </header>
      <section>
        <div class="vehicle">
          <header>
            <figure class="logo"></figure>
            <button class="mode"></button>
          </header>
        </div>
      </section>
    </main>
    <script>
      const vhc = document.querySelector(".vehicle");
      const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
      const updateTheme = (e) => vhc.classList.toggle("dark", e.matches);

      darkMode.addEventListener("change", updateTheme);
      updateTheme(darkMode);

      //Events
      const mode = document.querySelector(".mode");
      mode.addEventListener("click", function() {
        vhc.classList.toggle("dark");
      });
    </script>
  </body>
</html>
