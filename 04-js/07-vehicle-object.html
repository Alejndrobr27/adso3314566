<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 - Class Vehicle</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 100%;
            margin: 0 auto;
        }

        section {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        #vehicle {
            border-radius: 10px;
            background-color: #fbfcfc;
            padding: 20px;
            width: 100%;
            max-width: 100%;
            min-height: 576px;
            margin: 0 auto;
            transition: background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 10px;
        }

        #vehicle.dark {
            background-color: #13171a;
        }

        #vehicle>header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 0 10px;
        }

        #vehicle>header figure.logo {
            background: url(imgs/Mt-09.png) no-repeat left center / contain;
            height: 90px;
            width: 260px;
            margin: 0;
        }

        #vehicle>header button.mode {
            background: url(imgs/mode-dark.svg) no-repeat center / contain;
            border: none;
            cursor: pointer;
            height: 65px;
            width: 110px;
            transition: transform 0.4s ease-in;
        }

        #vehicle>nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 0 10px;
        }

        #vehicle>nav button {
            border: none;
            cursor: pointer;
            height: 65px;
            width: 65px;
            transition: transform 0.4s ease-in, opacity 0.3s ease;
        }

        #vehicle>nav button.prev {
            background: url(imgs/prev-light.svg) no-repeat center / contain;
            height: 70px;
            width: 70px;
        }

        #vehicle>nav button.next {
            background: url(imgs/next-light.svg) no-repeat center / contain;
            height: 70px;
            width: 70px;
        }

        #vehicle>nav button:hover {
            transform: scale(1.1);
        }

        #vehicle>nav button.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        #vehicle>nav figure.brand {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 24px;
            color: #333;
            margin: 0;
            text-align: center;
        }

        #vehicle.dark #vehicle>nav figure.brand { color: #fff; }

        .info-row {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 5px;
            flex-shrink: 0;
            padding: 0 10px;
            gap: 15px;
        }

        .info-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: none;
            box-shadow: none;
            padding: 0;
            height: 130px;
        }

        #vehicle.dark .info-item {
            background: none;
            box-shadow: none;
        }

        .info-item .value,
        .info-item .label { display: none; }

        .info-item .icon {
            width: 140px;
            height: 105px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            transition: background-image 0.3s ease;
            position: relative;
        }

        .info-item .icon-model { background-image: url(imgs/model-light.svg); }
        .info-item .icon-refer { background-image: url(imgs/refer-light.svg); }
        .info-item .icon-color { background-image: url(imgs/color-light.svg); }

        #vehicle.dark .info-item .icon-model { background-image: url(imgs/model-dark.svg); }
        #vehicle.dark .info-item .icon-refer { background-image: url(imgs/refer-dark.svg); }
        #vehicle.dark .info-item .icon-color { background-image: url(imgs/color-dark.svg); }

        #vehicle .text-data {
            position: absolute;
            top: 74px;
            left: 58%;
            transform: translateX(-50%);
            width: 90%;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            margin: 0;
            color: #333;
            pointer-events: none;
            z-index: 2;
            white-space: nowrap;
        }

        #vehicle.dark .text-data { color: #fff; }

        .landscape {
            position: relative;
            height: 220px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-image: url(imgs/dia.png);
            background-repeat: repeat-x;
            background-size: 200% 100%;
            animation: moveLandscape 2s linear infinite;
            animation-play-state: paused;
            flex-shrink: 0;
        }

        #vehicle.dark .landscape {
            background-image: url(imgs/noche.png);
        }

        @keyframes moveLandscape {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .model {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            background: url(imgs/rider1.png) no-repeat center / contain;
            height: 210px;
            width: 280px;
            transition: background-image 0.3s ease;
            z-index: 10;
            pointer-events: none;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: auto;
            margin-bottom: 8px;
            flex-shrink: 0;
            padding: 0 10px;
        }

        .controls-row button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease, opacity 0.3s ease;
        }

        .controls-row button:hover:not(:disabled) {
            transform: scale(1.12);
        }

        .controls-row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .controls-row button span {
            display: none;
        }

        .controls-row button .btn-icon {
            display: block;
            width: 70px;
            height: 70px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            transition: background-image 0.3s ease;
        }

        .controls-row button.btn-on .btn-icon { background-image: url('imgs/btn-on-light.svg'); }
        .controls-row button.btn-forward .btn-icon { background-image: url('imgs/btn-forward-light.svg'); }
        .controls-row button.btn-stop .btn-icon { background-image: url('imgs/btn-stop-light.svg'); }
        .controls-row button.btn-back .btn-icon { background-image: url('imgs/btn-back.light.svg'); }
        .controls-row button.btn-off .btn-icon { background-image: url('imgs/btn-off-light.svg'); }

        #vehicle.dark .controls-row button.btn-on .btn-icon { background-image: url('imgs/btn-on-dark.svg'); }
        #vehicle.dark .controls-row button.btn-forward .btn-icon { background-image: url('imgs/btn-forward-dark.svg'); }
        #vehicle.dark .controls-row button.btn-stop .btn-icon { background-image: url('imgs/btn-stop-dark.svg'); }
        #vehicle.dark .controls-row button.btn-back .btn-icon { background-image: url('imgs/btn-back-dark.svg'); }
        #vehicle.dark .controls-row button.btn-off .btn-icon { background-image: url('imgs/btn-off-dark.svg'); }

        .reference, .color { display: none; }

        .landscape.paused { animation-play-state: paused; }
        .landscape.reverse { animation-direction: reverse; }
        .landscape.running { animation-play-state: running; }

        @media (max-width: 600px) {
            section { padding: 0 8px; }
            #vehicle { padding: 12px; gap: 6px; }
            #vehicle>header figure.logo { height: 60px; width: 180px; }
            #vehicle>header button.mode { height: 50px; width: 80px; }
            #vehicle>nav figure.brand { font-size: 18px; }
            .info-item { height: 105px; }
            .info-item .icon { width: 95px; height: 75px; }
            #vehicle .text-data { font-size: 10px; top: 52px; left: 58%; }
            .landscape { height: 160px; }
            .model { height: 150px; width: 200px; }
            .controls-row { gap: 12px; }
            .controls-row button .btn-icon { width: 48px; height: 48px; }
        }
    </style>
</head>

<body>
    <main>
        <div class="contenedor-botones">
            <a href="/04-js/index.html" class="btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                </svg>
            </a>
        </div>

        <header>
            <h1>Class Vehicle</h1>
            <h2>Create and manipulate a vehicle object with properties</h2>
        </header>

        <section>
            <div class="vehicle" id="vehicle">

                <header>
                    <figure class="logo"></figure>
                    <button class="mode" id="modeToggle" aria-label="Toggle dark/light mode"></button>
                </header>

                <nav>
                    <button class="prev" id="prevBtn" aria-label="Previous"></button>
                    <figure class="brand" id="brandLabel">MT-09</figure>
                    <button class="next" id="nextBtn" aria-label="Next"></button>
                </nav>

                <div class="info-row">
                    <div class="info-item">
                        <div class="icon icon-model"></div>
                        <div class="text-data" id="modelText">MT-09</div>
                    </div>
                    <div class="info-item">
                        <div class="icon icon-refer"></div>
                        <div class="text-data" id="referText">MT-09</div>
                    </div>
                    <div class="info-item">
                        <div class="icon icon-color"></div>
                        <div class="text-data" id="colorText">BLUE/BLACK</div>
                    </div>
                </div>

                <div class="landscape" id="landscape">
                    <figure class="model" id="modelImage"></figure>
                </div>

                <div class="controls-row">
                    <button class="btn-on" id="onBtn" title="ON">
                        <span class="btn-icon"></span>
                    </button>
                    <button class="btn-forward" id="forwardBtn" title="FORWARD">
                        <span class="btn-icon"></span>
                    </button>
                    <button class="btn-stop" id="stopBtn" title="STOP">
                        <span class="btn-icon"></span>
                    </button>
                    <button class="btn-back" id="backBtn" title="BACK">
                        <span class="btn-icon"></span>
                    </button>
                    <button class="btn-off" id="offBtn" title="OFF">
                        <span class="btn-icon"></span>
                    </button>
                </div>

                <figure class="reference" style="display:none;">YAM-2024</figure>
                <figure class="color" style="display:none;">ICON BLUE</figure>

            </div>
        </section>
        
    </main>

    <script>
        const vhc = document.getElementById('vehicle');
        const mode = document.getElementById('modeToggle');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const landscape = document.getElementById('landscape');

        const lbrand = document.querySelector('.brand');
        const lmodel = document.getElementById('modelText');
        const lrefer = document.getElementById('referText');
        const lcolor = document.getElementById('colorText');
        const modelImage = document.getElementById('modelImage');

        const onBtn = document.getElementById('onBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const stopBtn = document.getElementById('stopBtn');
        const backBtn = document.getElementById('backBtn');
        const offBtn = document.getElementById('offBtn');

        let ix = 0;

        const vehicles = {
            attrs: [
                { brand: 'MT-09', refer: 'MT-09', model: 'MT-09', color: 'BLUE/BLACK', image: 'imgs/rider1.png' },
                { brand: 'R6', refer: 'YZF-R6', model: 'R6', color: 'BLUE/WHITE', image: 'imgs/rider2.png' },
                { brand: 'R1', refer: 'YZF-R1', model: 'R1', color: 'BLACK/BLUE', image: 'imgs/rider3.png' },
                { brand: 'XJ6', refer: 'XJ6', model: 'XJ6', color: 'WHITE/RED', image: 'imgs/rider4.png' },
                { brand: 'MT-07', refer: 'MT-07', model: 'MT-07', color: 'BLACK/YELLOW', image: 'imgs/rider5.png' },
            ]
        };

        class Vehicle {
            constructor(brand, refer, model, color, image) {
                this.brand = brand;
                this.refer = refer;
                this.model = model;
                this.color = color;
                this.image = image;
                this.displayData();
            }

            displayData() {
                lbrand.textContent = this.brand;
                lmodel.textContent = this.model;
                lrefer.textContent = this.refer;
                lcolor.textContent = this.color;
                modelImage.style.backgroundImage = `url('${this.image}')`;
            }
        }

        let car = new Vehicle(
            vehicles.attrs[ix].brand,
            vehicles.attrs[ix].refer,
            vehicles.attrs[ix].model,
            vehicles.attrs[ix].color,
            vehicles.attrs[ix].image
        );

        let vehicleState = 'off';

        function stopAnimation() {
            landscape.classList.add('paused');
            landscape.classList.remove('running');
            landscape.classList.remove('reverse');
        }

        function updateButtonsState() {
            onBtn.disabled = true;
            forwardBtn.disabled = true;
            stopBtn.disabled = true;
            backBtn.disabled = true;
            offBtn.disabled = true;

            switch (vehicleState) {
                case 'off':
                    onBtn.disabled = false;
                    break;

                case 'on':
                    forwardBtn.disabled = false;
                    backBtn.disabled = false;
                    break;

                case 'forward':
                    stopBtn.disabled = false;
                    break;

                case 'stop':
                    forwardBtn.disabled = false;
                    backBtn.disabled = false;
                    offBtn.disabled = false;
                    break;

                case 'back':
                    stopBtn.disabled = false;
                    break;
            }
        }

        function vibrate() {
            if (vehicleState !== 'on' && vehicleState !== 'stop') return

            modelImage.style.transform = `translateX(-50%) translateY(${1.5 * Math.sin(Date.now() / 15)}px)`
            requestAnimationFrame(vibrate)
        }

        onBtn.addEventListener('click', function () {
            if (vehicleState !== 'off') return;
            vehicleState = 'on';
            stopAnimation();
            updateButtonsState();
            vibrate();
        });

        forwardBtn.addEventListener('click', function () {
            if (vehicleState !== 'on' && vehicleState !== 'stop') return;
            vehicleState = 'forward';
            landscape.classList.remove('paused');
            landscape.classList.remove('reverse');
            landscape.classList.add('running');
            modelImage.style.transform = 'translateX(-50%)';
            updateButtonsState();
        });

        stopBtn.addEventListener('click', function () {
            if (vehicleState !== 'forward' && vehicleState !== 'back') return;
            vehicleState = 'stop';
            stopAnimation();
            updateButtonsState();
            vibrate();
        });

        backBtn.addEventListener('click', function () {
            if (vehicleState !== 'stop' && vehicleState !== 'on') return;
            vehicleState = 'back';
            landscape.classList.remove('paused');
            landscape.classList.add('running');
            landscape.classList.add('reverse');
            modelImage.style.transform = 'translateX(-50%)';
            updateButtonsState();
        });

        offBtn.addEventListener('click', function () {
            if (vehicleState !== 'stop') return;
            vehicleState = 'off';
            stopAnimation();
            modelImage.style.transform = 'translateX(-50%)';
            updateButtonsState();
        });

        updateButtonsState();

        function updateNavButtons() {
            if (ix === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (ix === vehicles.attrs.length - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        updateNavButtons();

        nextBtn.addEventListener('click', function () {
            if (ix < vehicles.attrs.length - 1) {
                ix++;
                car.brand = vehicles.attrs[ix].brand;
                car.refer = vehicles.attrs[ix].refer;
                car.model = vehicles.attrs[ix].model;
                car.color = vehicles.attrs[ix].color;
                car.image = vehicles.attrs[ix].image;
                car.displayData();
                updateNavButtons();
            }
        });

        prevBtn.addEventListener('click', function () {
            if (ix > 0) {
                ix--;
                car.brand = vehicles.attrs[ix].brand;
                car.refer = vehicles.attrs[ix].refer;
                car.model = vehicles.attrs[ix].model;
                car.color = vehicles.attrs[ix].color;
                car.image = vehicles.attrs[ix].image;
                car.displayData();
                updateNavButtons();
            }
        });

        const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        
        const updateTheme = (e) => {
            const isDark = e.matches;
            vhc.classList.toggle('dark', isDark);

            mode.style.backgroundImage = isDark ? "url('imgs/mode-dark.svg')" : "url('imgs/mode-light.svg')";
            prevBtn.style.backgroundImage = isDark ? "url('imgs/prev-dark.svg')" : "url('imgs/prev-light.svg')";
            nextBtn.style.backgroundImage = isDark ? "url('imgs/next-dark.svg')" : "url('imgs/next-light.svg')";
        };

        darkModeQuery.addEventListener('change', updateTheme);
        updateTheme(darkModeQuery);

        mode.addEventListener('click', function () {
            vhc.classList.toggle('dark');
            const isDark = vhc.classList.contains('dark');
            
            mode.style.backgroundImage = isDark ? "url('imgs/mode-dark.svg')" : "url('imgs/mode-light.svg')";
            prevBtn.style.backgroundImage = isDark ? "url('imgs/prev-dark.svg')" : "url('imgs/prev-light.svg')";
            nextBtn.style.backgroundImage = isDark ? "url('imgs/next-dark.svg')" : "url('imgs/next-light.svg')";
        });
    </script>
</body>
</html>
