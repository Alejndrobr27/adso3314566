<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-JavaScript</title>

    <link rel="stylesheet" href="css/animate.min.css">
    <link rel="stylesheet" href="../src/css/04-js.css">

    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }

        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }

        main section figure.alive {
            background-position-x: 0px;
        }

        main section figure.attack {
            background-position-x: -202px;
        }

        main section figure.feed {
            background-position-x: -404px;
        }

        main section figure.dead {
            background-position-x: -608px;
        }

        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
        }

        main section div.actions button {
            background: #fff9;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 0.4rem 1rem;
            transition: transform 0.2s ease-in;
        }

        main section div.actions button:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <a href="/04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>

    <main>
        <header>
            <h1>04-Methods Object</h1>
            <h2>Use methods to interact with objects.</h2>
        </header>

        <section>
            <h3 class="pk-name"></h3>
            <br>
            <h4 class="pk-hp"></h4>

            <figure class="pk-image animate__animated"></figure>

            <div class="actions">
                <button class="btn-attack">Attack</button>
                <button class="btn-feed">Feed</button>
            </div>
        </section>
    </main>

    <script>
        // Elements
        const pkName = document.querySelector('.pk-name');
        const pkHp = document.querySelector('.pk-hp');
        const pkImage = document.querySelector('.pk-image');

        const btnAttack = document.querySelector('.btn-attack');
        const btnFeed = document.querySelector('.btn-feed');

        // Object
        const pokemon = {
            name: 'snorlax',
            type: 'normal',
            hp: 100,
            image: 'imgs/snorlax-sprite.png',
            lsAlive: true,

            render() {
                pkName.textContent = `${this.name} (${this.type})`;
                pkHp.textContent = `HP: ${this.hp}`;
                pkImage.style.backgroundImage = `url(${this.image})`;

                if (this.lsAlive) {
                    pkImage.className = 'pk-image animate__animated alive';
                } else {
                    pkImage.className = 'pk-image animate__animated dead';
                }
            },

            updateHp(fx) {
                pkHp.textContent = `HP: ${this.hp}`;
                pkImage.className = `pk-image animate__animated ${fx}`;

                setTimeout(() => {
                    if (this.lsAlive) {
                        pkImage.className = 'pk-image animate__animated alive';
                E    } else {
                        pkImage.className = 'pk-image animate__animated dead';
                    }
                }, 500);
            },

            attack() {
                if (!this.lsAlive) return;

                this.hp -= 10;

                if (this.hp <= 0) {
                    this.hp = 0;
                    this.lsAlive = false;
                }

                this.updateHp(this.lsAlive ? 'attack' : 'dead');
            },

            feed() {
                if (!this.lsAlive) return;

                this.hp += 10;

                if (this.hp > 100) {
                    this.hp = 100;
                }

                this.updateHp('feed');
            }
        };

        // Mostrar Pokémon al cargar
        pokemon.render();

        // Botón Attack
        btnAttack.addEventListener('click', () => {
            pokemon.attack();
        });

        // Botón Feed
        btnFeed.addEventListener('click', () => {
            pokemon.feed();
        });

    </script>

</body>

</html>
