<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-Types and Objects</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
</head>

<body>
    <a href="/04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>

    <main>
        <header>
            <h1>04-Types and Objects</h1>
            <h2>Types and Objects in JavaScript</h2>
        </header>

        <section>
            <ul class="objects"></ul>
        </section>

        <script>
            const objs = document.querySelector('.objects');

            // Object String
            const string = new String('Javascript💛');
            objs.innerHTML = `
                <li>
                    String => ${string} | Constructor: ${string.constructor.name}
                </li>
            `;

            // Object Number
            const number = new Number(256);
            objs.innerHTML += `
                <li>
                    Number => ${number} | Object: ${number.constructor.name}
                </li>
            `;

            // Object Boolean
            const bool = new Boolean(512 > 256);
            objs.innerHTML += `
                <li>
                    Boolean => ${bool} | Object: ${bool.constructor.name}
                </li>
            `;

            // Object Array
            const array = new Array('🚕', '🚢', '🚌', '🛩️');
            objs.innerHTML += `
                <li>
                    Array => ${array} | Object: ${array.constructor.name}
                </li>
            `;

            // Object Date
            const date = new Date();
            objs.innerHTML += `
                <li>
                    Date => ${date} | Object: ${date.constructor.name}
                </li>
            `;

            // Object Object
            const object = new Object({ name: 'Vehiculo', type: 'Transporte' });
            objs.innerHTML += `
                <li>
                    Object => ${object.name} | Object: ${object.constructor.name}
                </li>
            `;

        </script>

    </main>
</body>

</html>
