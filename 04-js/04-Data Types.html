<body>
    <a href="/04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>

    <main>
        <header>
            <h1>04-Data Types</h1>
            <h2>Understand and work with different object types.</h2>
        </header>
        
        <section>
           <section>
            <h3>Type String:    <small class="type-string"></small></h3>
            <h3>Type Number:    <small class="type-number"></small></h3>
            <h3>Type Boolean:   <small class="type-boolean"></small></h3>
            <h3>Type Null:      <small class="type-null"></small></h3>
            <h3>Type Undefined: <small class="type-undefined"></small></h3>
            <h3>Type Array:     <small class="type-array"></small></h3>
            <h3>Type Object:    <small class="type-object"></small></h3>
        </section>
        </section>
    </main>
    <script>
        // type string
        const tstring = document.querySelector('.type-string');
        const message = 'Hello JS ✌️';
        tstring.textContent = `characters: ${message.length}`;

        // type number
        const tnumber = document.querySelector('.type-number');
        const number = 45;
        const number2 = 12.4;
        tnumber.textContent = `(45 + 12.4) = ${number + number2}`;

        // type boolean
        const tboolean = document.querySelector('.type-boolean');
        const isTrue = (
            4 > 8
        ) ;
        tboolean.textContent = `4 > 8 is ${isTrue}`;

        // type null
        const tnull = document.querySelector('.type-null');
        const lscreated = null;
        tnull.textContent = `lscreated is ${lscreated}`;

        // type undefined
        const tundefined = document.querySelector('.type-undefined');
        const lsbinary = undefined;
        tundefined.textContent = `lsbinary is ${lsbinary}`;

        // type array
        const tarray = document.querySelector('.type-array');
        const landscapes = ['🏙️', '🏞️', '🏜️', '🏝️'];
        tarray.textContent = `Landscapes: ${landscapes.join(', ')}`;

        // type object
        const tobject = document.querySelector('.type-object');
        const hashiza = {
            name: 'Hashiza',
            age: 25,
            country: 'Japan'
        };
        tobject.textContent = `Name: ${hashiza.name}, Age: ${hashiza.age}, Country: ${hashiza.country}`;

    </script>
</body>
